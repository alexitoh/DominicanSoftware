<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dominican Software · Panel del propietario</title>
<style>
  :root { --fondo:#EDF0F2; --papel:#fff; --tinta:#15212B; --suave:#5B6B78; --linea:#D5DBE0; --primario:#0E5A6B; --ok:#2F9E5B; --bajo:#E59A0F; --mal:#C8402F; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#0f161c; --papel:#18222b; --tinta:#e8eef2; --suave:#9aabb8; --linea:#2a3843; --primario:#3aa6bd; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta); font:16px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.9rem 1rem; background:var(--tinta); color:var(--papel); }
  header h1 { margin:0; font-size:1.1rem; }
  main { max-width:960px; margin:0 auto; padding:1rem; }
  .btn { padding:.55rem .9rem; border:1px solid var(--linea); border-radius:8px; background:var(--papel); color:var(--tinta); font:inherit; font-weight:600; cursor:pointer; }
  .btn.p { background:var(--primario); border-color:var(--primario); color:#fff; }
  .btn.m { color:var(--mal); border-color:var(--mal); }
  .btn.chico { padding:.35rem .6rem; font-size:.875rem; }
  input, select, textarea { width:100%; padding:.6rem .7rem; border:1px solid var(--linea); border-radius:8px; background:var(--papel); color:var(--tinta); font:inherit; }
  label { display:block; font-weight:600; font-size:.875rem; margin:.6rem 0 .2rem; }
  .caja { background:var(--papel); border:1px solid var(--linea); border-radius:12px; padding:1rem; }
  .login { max-width:360px; margin:15vh auto 0; }
  .error { color:var(--mal); margin:.5rem 0 0; font-size:.9rem; }
  .tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin:0 0 1rem; }
  .tabs button { padding:.45rem .8rem; border:1px solid var(--linea); border-radius:999px; background:var(--papel); color:var(--suave); font:inherit; cursor:pointer; }
  .tabs button[aria-pressed="true"] { background:var(--primario); border-color:var(--primario); color:#fff; font-weight:600; }
  .neg { margin-bottom:.75rem; }
  .neg h2 { margin:0; font-size:1.05rem; display:flex; justify-content:space-between; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .neg p { margin:.25rem 0 0; color:var(--suave); font-size:.875rem; }
  .estado { padding:.15rem .6rem; border-radius:999px; font-size:.75rem; font-weight:700; color:#fff; }
  .estado.pendiente { background:var(--bajo); } .estado.activo { background:var(--ok); } .estado.suspendido, .estado.vencido { background:var(--mal); }
  .acciones { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.7rem; }
  .vacio { text-align:center; color:var(--suave); padding:2rem 0; }
  .resumen { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:.6rem; margin-bottom:1rem; }
  .resumen div { background:var(--papel); border:1px solid var(--linea); border-radius:12px; padding:.7rem .9rem; }
  .resumen strong { display:block; font-size:1.4rem; }
  .resumen span { color:var(--suave); font-size:.8rem; }
  dialog { border:1px solid var(--linea); border-radius:14px; background:var(--papel); color:var(--tinta); padding:1.1rem; width:min(92vw, 420px); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h3 { margin:0 0 .3rem; }
  .buscar { margin:0 0 .75rem; }
  .fila { display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.45rem 0; border-top:1px solid var(--linea); font-size:.9rem; }
  .fila:first-of-type { border-top:0; }
  .fila small { color:var(--suave); display:block; }
  .sec { margin:1rem 0 .3rem; font-size:.95rem; }
  dialog.ancho { width:min(94vw, 560px); max-height:90vh; overflow:auto; }
  .aviso { background:rgba(229,154,15,.15); border:1px solid var(--bajo); border-radius:8px; padding:.5rem .7rem; font-size:.875rem; margin:.5rem 0; }
  .toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:var(--tinta); color:var(--papel); padding:.6rem 1rem; border-radius:10px; z-index:9; }
</style>
</head>
<body>
<div id="raiz"></div>
<dialog id="dlg"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const raiz = $('#raiz'), dlg = $('#dlg');
let token = sessionStorage.getItem('prop_token');
let datos = null, filtro = 'pendiente', busqueda = '', historial = null, mensajes = null;

async function api(metodo, ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: metodo,
    headers: { ...(cuerpo ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { salir(); throw new Error('Tu sesión venció. Entra de nuevo.'); }
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
const el = (t, a = {}, ...h) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (v !== false && v != null) e.setAttribute(k, v); } for (const x of h.flat(Infinity)) if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); return e; };
const fecha = (f) => (f ? String(f).replace('T', ' ').slice(0, 16) : '—');
const dias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const mb = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
const rd = (n) => 'RD$ ' + Number(n || 0).toLocaleString('es-DO', { maximumFractionDigits: 2 });
const toast = (t) => { const x = el('div', { class: 'toast' }, t); document.body.append(x); setTimeout(() => x.remove(), 3500); };
const ETQ = { pendiente: 'Pendiente', activo: 'Activo', vencido: 'Vencido', suspendido: 'Suspendido' };

function pantallaLogin(msg = '') {
  const clave = el('input', { type: 'password', placeholder: 'Clave del propietario', autocomplete: 'current-password' });
  const err = el('p', { class: 'error' }, msg);
  const entrar = async () => {
    try { const r = await api('POST', '/api/propietario/login', { clave: clave.value }); token = r.token; sessionStorage.setItem('prop_token', token); await cargar(); }
    catch (e) { err.textContent = e.message; }
  };
  clave.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  raiz.replaceChildren(el('div', { class: 'caja login' }, el('h1', {}, 'Dominican Software'), el('p', {}, 'Panel del propietario. Acceso solo para el dueño del sistema.'), clave, err, el('div', { class: 'acciones' }, el('button', { class: 'btn p', onclick: entrar }, 'Entrar'))));
  clave.focus();
}
function salir() { token = null; sessionStorage.removeItem('prop_token'); pantallaLogin(); }

async function cargar() {
  try {
    datos = await api('GET', '/api/propietario/negocios');
    if (filtro === 'historial') historial = await api('GET', '/api/propietario/historial');
    pintar();
  } catch (e) { if (!token) return; raiz.replaceChildren(el('main', {}, el('p', { class: 'error' }, e.message))); }
}

const porVencer = (x) => x.estado === 'activo' && x.diasParaVencer != null && x.diasParaVencer <= 7;
const grupos = {
  pendiente: (x) => x.estado === 'pendiente', activo: (x) => x.estado === 'activo', porvencer: porVencer,
  vencido: (x) => x.estado === 'vencido', suspendido: (x) => x.estado === 'suspendido', todos: () => true,
};

function pintar() {
  const lista = datos.negocios, r = datos.resumen;
  const n = (k) => lista.filter(grupos[k]).length;
  const q = busqueda.trim().toLowerCase();
  const visibles = ['historial', 'mensajes'].includes(filtro) ? [] : lista.filter(grupos[filtro]).filter((x) => !q ||
    [x.nombre, x.admin?.nombre, x.admin?.usuario, x.admin?.correo].some((t) => String(t || '').toLowerCase().includes(q)));
  const tab = (id, t) => el('button', { 'aria-pressed': String(filtro === id), onclick: async () => { filtro = id; if (id === 'historial') historial = await api('GET', '/api/propietario/historial'); if (id === 'mensajes') mensajes = await api('GET', '/api/propietario/avisos'); pintar(); } }, ['historial', 'todos', 'mensajes'].includes(id) ? t : `${t} (${n(id)})`);
  const buscar = el('input', { class: 'buscar', type: 'search', placeholder: 'Buscar por negocio, nombre, usuario o correo…', value: busqueda });
  buscar.addEventListener('input', () => { busqueda = buscar.value; const pos = buscar.selectionStart; pintar(); const nuevo = $('.buscar'); nuevo.focus(); nuevo.setSelectionRange(pos, pos); });
  raiz.replaceChildren(
    el('header', {}, el('h1', {}, 'Dominican Software · Panel del propietario'), el('div', { class: 'acciones' },
      el('button', { class: 'btn p chico', onclick: () => redactar() }, 'Mensaje masivo'), el('button', { class: 'btn chico', onclick: cargar }, 'Actualizar'), el('button', { class: 'btn chico', onclick: salir }, 'Salir'))),
    el('main', {},
      el('div', { class: 'resumen' },
        ...[[n('pendiente'), 'Por aprobar'], [n('activo'), 'Activos'], [n('porvencer'), 'Vencen en 7 días'], [n('vencido'), 'Vencidos'], [n('suspendido'), 'Suspendidos'],
          [rd(r.ingresoMensual), 'Ingreso mensual estimado'], [rd(r.cobradoMes), 'Cobrado este mes'], [mb(r.dbBytes), `Base de datos${r.libreBytes > 4096 ? ` (${mb(r.libreBytes)} libres)` : ''}`]]
          .map(([v, t]) => el('div', {}, el('strong', {}, String(v)), el('span', {}, t)))),
      el('div', { class: 'tabs' }, tab('pendiente', 'Por aprobar'), tab('activo', 'Activos'), tab('porvencer', 'Por vencer'), tab('vencido', 'Vencidos'), tab('suspendido', 'Suspendidos'), tab('todos', 'Todos'), tab('mensajes', 'Mensajes'), tab('historial', 'Historial')),
      filtro === 'historial' ? vistaHistorial() : filtro === 'mensajes' ? vistaMensajes() : [buscar, visibles.length ? visibles.map(tarjeta) : el('p', { class: 'vacio' }, 'No hay negocios en esta lista.')]));
}

function vistaHistorial() {
  return el('div', {},
    el('div', { class: 'caja', style: 'margin-bottom:.75rem' }, el('h3', { class: 'sec', style: 'margin-top:0' }, 'Pagos recibidos'),
      historial.pagos.length ? historial.pagos.map((p) => el('div', { class: 'fila' }, el('span', {}, p.negocio || '—', el('small', {}, `${fecha(p.fecha)}${p.nota ? ' · ' + p.nota : ''}`)), el('strong', {}, `${rd(p.monto)} · ${p.meses} mes(es)`))) : el('p', { class: 'vacio' }, 'Sin pagos registrados.')),
    el('div', { class: 'caja' }, el('h3', { class: 'sec', style: 'margin-top:0' }, 'Lo que has hecho en el panel'),
      historial.acciones.length ? historial.acciones.map((a) => el('div', { class: 'fila' }, el('span', {}, `${a.accion}: ${a.negocio || '—'}`, el('small', {}, a.detalle || '')), el('small', {}, fecha(a.fecha)))) : el('p', { class: 'vacio' }, 'Todavía no hay movimientos.')));
}

function vistaMensajes() {
  const l = mensajes.avisos;
  return el('div', { class: 'caja' },
    el('div', { class: 'acciones', style: 'margin:0 0 .5rem' }, el('button', { class: 'btn p chico', onclick: () => redactar() }, 'Nuevo mensaje masivo')),
    l.length ? l.map((a) => el('div', { class: 'fila' },
      el('span', {}, `${a.titulo}${a.nivel === 'importante' ? ' ⚠' : ''}`, el('small', {}, `Para: ${a.destino} · ${fecha(a.creado)} · ${a.vigente ? 'vigente hasta ' + a.caduca : 'caducado'} · leído por ${a.leidos} de ${a.total}`), el('small', {}, a.mensaje)),
      el('button', { class: 'btn chico m', onclick: async () => { if (confirm('¿Borrar este mensaje? Dejará de verse en los clientes.')) { await api('DELETE', `/api/propietario/avisos/${a.id}`); mensajes = await api('GET', '/api/propietario/avisos'); pintar(); } } }, 'Borrar')))
      : el('p', { class: 'vacio' }, 'Todavía no has enviado mensajes.'));
}

// Un cliente (n) o varios: todos, los que vencen pronto o los activos
function redactar(n) {
  const destino = el('select', {}, ...(n ? [el('option', { value: 'uno' }, n.nombre)] : [
    el('option', { value: 'todos' }, 'Todos los clientes'),
    el('option', { value: 'porvencer' }, 'Los que vencen en 7 días o menos'),
    el('option', { value: 'activo' }, 'Solo los activos')]));
  const titulo = el('input', { maxlength: '80', placeholder: 'Ej. Recordatorio de pago' });
  const texto = el('textarea', { rows: 4, maxlength: '1000', placeholder: 'Escribe el mensaje que verá el cliente en su campana de avisos…' });
  const imp = el('input', { type: 'checkbox' });
  const dias = el('input', { type: 'number', min: '1', max: '365', value: '30' });
  const err = el('p', { class: 'error' });
  modal(n ? `Mensaje para "${n.nombre}"` : 'Mensaje masivo', [
    el('p', { class: 'ayuda' }, 'El cliente lo ve en la campana de la app (web o teléfono) la próxima vez que se conecte. Se muestra a todos los usuarios de ese negocio.'),
    el('label', {}, 'Para'), destino, el('label', {}, 'Título'), titulo, el('label', {}, 'Mensaje'), texto,
    el('label', { class: 'casilla' }, imp, ' Marcar como importante'), el('label', {}, 'Días que estará visible'), dias, err],
  [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn p', onclick: intentar(err, async () => {
      const cuerpo = { titulo: titulo.value, mensaje: texto.value, nivel: imp.checked ? 'importante' : 'info', dias: dias.value };
      if (destino.value === 'todos') cuerpo.destino = 'todos';
      else {
        cuerpo.destino = 'negocios';
        cuerpo.negocios = n ? [n.uid] : datos.negocios.filter((x) => destino.value === 'porvencer' ? porVencer(x) : x.estado === 'activo').map((x) => x.uid);
        if (!cuerpo.negocios.length) throw new Error('No hay clientes en ese grupo.');
      }
      const total = destino.value === 'todos' ? 'todos los clientes' : `${cuerpo.negocios.length} cliente(s)`;
      if (!n && !confirm(`¿Enviar este mensaje a ${total}?`)) return;
      await api('POST', '/api/propietario/avisos', cuerpo);
      cerrar(); toast('Mensaje enviado a ' + total);
      if (filtro === 'mensajes') { mensajes = await api('GET', '/api/propietario/avisos'); pintar(); }
    }) }, 'Enviar')]);
}

function tarjeta(n) {
  const a = n.admin || {};
  const ac = [];
  if (n.estado === 'pendiente') {
    ac.push(el('button', { class: 'btn p chico', onclick: () => aprobar(n) }, 'Aprobar (ya pagó)'));
    ac.push(el('button', { class: 'btn m chico', onclick: () => eliminar(n, true) }, 'Rechazar y eliminar'));
  } else {
    ac.push(el('button', { class: 'btn p chico', onclick: () => pago(n) }, 'Registrar pago'));
    ac.push(el('button', { class: 'btn chico', onclick: () => detalle(n) }, 'Detalle'));
    ac.push(el('button', { class: 'btn chico', onclick: () => redactar(n) }, 'Enviar mensaje'));
    if (n.estado === 'suspendido') ac.push(el('button', { class: 'btn chico', onclick: () => confirmarAccion(n, 'reactivar', `¿Reactivar "${n.nombre}"?`) }, 'Reactivar'));
    else ac.push(el('button', { class: 'btn m chico', onclick: () => confirmarAccion(n, 'suspender', `¿Suspender "${n.nombre}"? Sus usuarios no podrán entrar ni sincronizar, pero sus datos se conservan.`) }, 'Suspender'));
    ac.push(el('button', { class: 'btn chico', onclick: () => editar(n) }, 'Editar'));
    ac.push(el('button', { class: 'btn chico', onclick: () => respaldo(n) }, 'Descargar respaldo'));
    ac.push(el('button', { class: 'btn m chico', onclick: () => eliminar(n) }, 'Eliminar'));
  }
  const venc = n.vence ? (n.diasParaVencer < 0 ? `venció hace ${-n.diasParaVencer} día(s) (${n.vence})` : `vence ${n.vence} (en ${n.diasParaVencer} día(s))`) : 'sin vencimiento';
  return el('div', { class: 'caja neg' },
    el('h2', {}, n.nombre, el('span', { class: `estado ${n.estado}` }, ETQ[n.estado])),
    el('p', {}, `Administrador: ${a.nombre || '—'} · @${a.usuario || '—'} · `, a.correo ? el('a', { href: 'mailto:' + a.correo }, a.correo) : 'sin correo'),
    el('p', {}, `Registrado: ${fecha(n.creado)}${n.aprobado ? ` · Aprobado: ${fecha(n.aprobado)}` : ''}`),
    n.estado === 'pendiente' ? null : el('p', {}, `Plan: ${n.plan}${n.precio != null ? ` (${rd(n.precio)})` : ''} · ${venc}`),
    n.estado === 'pendiente' ? null : el('p', {}, `Usuarios: ${n.usuarios} · Dispositivos: ${n.dispositivos} · Registros: ${n.registros} · Espacio: ${mb(n.bytes)} · Último acceso: ${fecha(n.ultimoAcceso)}`),
    n.notas ? el('p', {}, `Notas: ${n.notas}`) : null,
    el('div', { class: 'acciones' }, ac));
}

function modal(titulo, contenido, botones, ancho = false) {
  dlg.className = ancho ? 'ancho' : '';
  dlg.replaceChildren(el('h3', {}, titulo), ...contenido, el('div', { class: 'acciones' }, ...botones));
  if (!dlg.open) dlg.showModal();
}
const cerrar = () => dlg.close();
const btnCerrar = () => el('button', { class: 'btn', onclick: cerrar }, 'Cerrar');
const intentar = (err, fn) => async () => { try { err.textContent = ''; await fn(); } catch (e) { err.textContent = e.message; } };

function aprobar(n) {
  const plan = el('select', {}, ...['mensual', 'trimestral', 'anual', 'prueba', 'permanente'].map((x) => el('option', { value: x }, x)));
  const vence = el('input', { type: 'date', value: dias(30) });
  const precio = el('input', { type: 'number', min: '0', step: '0.01', placeholder: 'Lo que paga por mes (opcional)' });
  plan.addEventListener('change', () => { vence.value = { mensual: dias(30), trimestral: dias(90), anual: dias(365), prueba: dias(7), permanente: '' }[plan.value]; });
  const err = el('p', { class: 'error' });
  modal(`Aprobar "${n.nombre}"`, [
    el('p', {}, `${(n.admin || {}).nombre || ''} · ${(n.admin || {}).correo || ''}`),
    el('label', {}, 'Plan'), plan, el('label', {}, 'Vence (vacío = sin vencimiento)'), vence, el('label', {}, 'Precio mensual'), precio, err],
  [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn p', onclick: intentar(err, async () => { await api('PATCH', `/api/propietario/negocios/${n.uid}`, { accion: 'aprobar', plan: plan.value, vence: vence.value || null, precio: precio.value }); cerrar(); filtro = 'activo'; await cargar(); toast('Negocio aprobado'); }) }, 'Aprobar')]);
}

function pago(n) {
  const monto = el('input', { type: 'number', min: '0', step: '0.01', value: n.precio ?? '' });
  const meses = el('input', { type: 'number', min: '0', max: '60', value: '1' });
  const nota = el('input', { placeholder: 'Ej. transferencia Banreservas, efectivo…' });
  const err = el('p', { class: 'error' });
  modal(`Registrar pago de "${n.nombre}"`, [
    el('p', { class: 'aviso' }, `Se suma al vencimiento actual (${n.vence || 'sin fecha'}) o a hoy si ya venció. Si estaba suspendido o vencido, queda activo.`),
    el('label', {}, 'Monto recibido (RD$)'), monto, el('label', {}, 'Meses que cubre (0 = solo anotar el pago)'), meses, el('label', {}, 'Nota'), nota, err],
  [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn p', onclick: intentar(err, async () => { const r = await api('POST', `/api/propietario/negocios/${n.uid}/pagos`, { monto: monto.value || 0, meses: meses.value || 0, nota: nota.value }); cerrar(); await cargar(); toast(`Pago registrado. Vence: ${r.vence || '—'}`); }) }, 'Registrar')]);
}

function editar(n) {
  const plan = el('input', { value: n.plan });
  const vence = el('input', { type: 'date', value: n.vence || '' });
  const precio = el('input', { type: 'number', min: '0', step: '0.01', value: n.precio ?? '' });
  const notas = el('textarea', { rows: 3 }, n.notas || '');
  const err = el('p', { class: 'error' });
  modal(`Editar "${n.nombre}"`, [
    el('label', {}, 'Plan'), plan, el('label', {}, 'Vence'), vence, el('label', {}, 'Precio mensual'), precio, el('label', {}, 'Notas (contacto, acuerdos…)'), notas, err],
  [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn p', onclick: intentar(err, async () => { await api('PATCH', `/api/propietario/negocios/${n.uid}`, { accion: 'editar', plan: plan.value, vence: vence.value || null, precio: precio.value, notas: notas.value }); cerrar(); await cargar(); }) }, 'Guardar')]);
}

function confirmarAccion(n, accion, texto) {
  modal('Confirmar', [el('p', {}, texto)], [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn p', onclick: async () => { await api('PATCH', `/api/propietario/negocios/${n.uid}`, { accion }); cerrar(); await cargar(); } }, 'Confirmar')]);
}

async function respaldo(n) {
  try {
    const j = await api('GET', `/api/propietario/negocios/${n.uid}/respaldo`);
    const blob = new Blob([JSON.stringify(j)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `respaldo-${n.nombre.replace(/[^\w-]+/g, '_')}-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    toast(`Respaldo descargado (${j.registros.length} registros)`);
  } catch (e) { toast(e.message); }
}

function eliminar(n, rechazo = false) {
  const conf = el('input', { placeholder: 'Escribe el nombre exacto del negocio', autocomplete: 'off' });
  const err = el('p', { class: 'error' });
  modal(rechazo ? `Rechazar "${n.nombre}"` : `Eliminar "${n.nombre}"`, [
    el('p', { class: 'aviso' }, rechazo
      ? 'Se borrará el registro y la cuenta del administrador. Esta persona podrá volver a registrarse.'
      : `Se borrarán para siempre sus ${n.registros} registros (ventas, productos, clientes…), sus ${n.usuarios} usuario(s) y sus dispositivos, y se compacta la base para recuperar el espacio (${mb(n.bytes)}). No se puede deshacer. Si tiene los datos en sus teléfonos, podrán seguir viéndolos allí, pero ya no sincronizarán.`),
    rechazo ? null : el('button', { class: 'btn chico', onclick: () => respaldo(n) }, 'Descargar respaldo antes de eliminar'),
    el('label', {}, `Para confirmar escribe: ${n.nombre}`), conf, err],
  [el('button', { class: 'btn', onclick: cerrar }, 'Cancelar'),
    el('button', { class: 'btn m', onclick: intentar(err, async () => { const r = await api('DELETE', `/api/propietario/negocios/${n.uid}`, { confirmar: conf.value }); cerrar(); await cargar(); toast(`Eliminado. Espacio liberado: ${mb(r.liberado)}`); }) }, 'Eliminar para siempre')]);
}

async function detalle(n) {
  const d = await api('GET', `/api/propietario/negocios/${n.uid}`);
  const err = el('p', { class: 'error' });
  const usuarios = d.usuarios.map((u) => el('div', { class: 'fila' },
    el('span', {}, `${u.nombre} (@${u.usuario})`, el('small', {}, `${u.rol}${u.activo ? '' : ' · desactivado'} · último acceso ${fecha(u.ultimo)}${u.correo ? ' · ' + u.correo : ''}`)),
    el('span', { class: 'acciones', style: 'margin:0' },
      el('button', { class: 'btn chico', onclick: intentar(err, async () => { await api('PATCH', `/api/propietario/cuentas/${u.uid}`, { activo: !u.activo }); await detalle(n); }) }, u.activo ? 'Desactivar' : 'Activar'),
      el('button', { class: 'btn chico', onclick: () => claveCuenta(u, n) }, 'Nueva clave'))));
  const pagos = d.pagos.length ? d.pagos.map((p) => el('div', { class: 'fila' },
    el('span', {}, `${fecha(p.fecha)} · ${rd(p.monto)} · ${p.meses} mes(es)`, el('small', {}, p.nota || '')),
    el('button', { class: 'btn chico m', onclick: intentar(err, async () => { if (confirm('¿Borrar este pago del historial? (No cambia el vencimiento)')) { await api('DELETE', `/api/propietario/pagos/${p.id}`); await detalle(n); await cargar(); } }) }, 'Borrar'))) : [el('p', { class: 'ayuda' }, 'Sin pagos registrados.')];
  modal(n.nombre, [
    el('p', { class: 'ayuda' }, `Registros: ${n.registros} · Espacio: ${mb(n.bytes)} · Dispositivos: ${d.dispositivos.map((x) => x.codigo).join(', ') || '—'}`),
    el('h3', { class: 'sec' }, 'Usuarios'), ...usuarios,
    el('h3', { class: 'sec' }, 'Pagos'), ...pagos,
    el('h3', { class: 'sec' }, 'Datos guardados'),
    el('p', { class: 'ayuda' }, d.tablas.map((t) => `${t.tabla}: ${t.n}`).join(' · ') || 'Sin datos todavía.'), err],
  [btnCerrar()], true);
}

function claveCuenta(u, n) {
  const clave = el('input', { value: Math.random().toString(36).slice(2, 8) + Math.floor(100 + Math.random() * 900) });
  const err = el('p', { class: 'error' });
  modal('Nueva clave temporal', [el('p', {}, `Para @${u.usuario}. Deberá cambiarla al entrar. Entrégasela por un medio seguro.`), clave, err],
    [el('button', { class: 'btn', onclick: () => detalle(n) }, 'Volver'),
      el('button', { class: 'btn p', onclick: intentar(err, async () => { await api('POST', `/api/propietario/cuentas/${u.uid}/clave`, { clave: clave.value }); toast('Clave asignada: ' + clave.value); await detalle(n); }) }, 'Asignar')]);
}

if (token) cargar(); else pantallaLogin();
</script>
